name: breeder_book
description: Offline bird breeding record keeper (MVP) - ring numbers, parents, mutations, pairs, eggs, pedigree.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  archive: 4.5.2
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  # 10.3.3+ uses flutter.compileSdkVersion (8.x hardcodes 34; breaks on Flutter 3.47+)
  file_picker: ^10.3.3
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
